<div class="ct-delete-car-modal">
  <h2>Delete Car</h2>

  <p>Are you sure you want to delete this car?</p>

  <div class="ct-delete-car-modal__actions">
    <button ctButton ctButtonVariant="outline" (click)="cancel()">Cancel</button>
    <button ctButton ctButtonVariant="danger" (click)="deleteCar()">Delete</button>
  </div>
</div>
