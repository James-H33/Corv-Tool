<div class="ct-login">
  <div class="ct-login-form">
    <div class="ct-login-form__row">
      <label for="username">Username:</label>
      <input
        ctInput
        id="username"
        placeholder="username or email"
        [formField]="form.username"
        (keydown.enter)="login()"
        type="text"
      />
    </div>

    <div class="ct-login-form__row">
      <label for="password">Password:</label>
      <input
        ctInput
        id="password"
        placeholder="password"
        [formField]="form.password"
        (keydown.enter)="login()"
        type="password"
      />
    </div>

    @if (errorMessage()) {
      <div class="ct-login-form__row ct-login-form__row--error">
        {{ errorMessage() }}
      </div>
    }

    <div class="ct-login-form__row ct-login-form__row--actions">
      <button
        ctButton
        ctButtonVariant="primary"
        (click)="login()"
        (keydown.enter)="login()"
        [disabled]="!form().valid()"
      >
        Login
      </button>
    </div>
  </div>
</div>
