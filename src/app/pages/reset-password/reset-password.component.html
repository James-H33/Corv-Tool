<div class="ct-reset-password">
  <div class="ct-reset-password__form">
    <h2>Set new password:</h2>

    <div class="ct-reset-password__row">
      <label for="password">New Password:</label>

      <div class="ct-reset-password__password-input-wrapper">
        <input
          ctInput
          id="password"
          placeholder="Password"
          [formField]="form.password"
          (keydown.enter)="submit()"
          [type]="showPassword() ? 'text' : 'password'"
        />

        <span
          class="ct-reset-password__show-password"
          (click)="toggleShowPassword()"
          role="button"
          tabindex="0"
        >
          <ct-icon [icon]="showPassword() ? 'eye-off' : 'eye'" size="20"></ct-icon>
        </span>
      </div>
    </div>

    <div class="ct-reset-password__row">
      <label for="confirmPassword">Confirm New Password:</label>

      <div class="ct-reset-password__password-input-wrapper">
        <input
          ctInput
          id="confirmPassword"
          placeholder="Confirm Password"
          [formField]="form.confirmPassword"
          (keydown.enter)="submit()"
          [type]="showPassword() ? 'text' : 'password'"
        />
        <span
          class="ct-reset-password__show-password"
          (click)="toggleShowPassword()"
          role="button"
          tabindex="0"
        >
          <ct-icon [icon]="showPassword() ? 'eye-off' : 'eye'" size="20"></ct-icon>
        </span>
      </div>
    </div>

    @if (errorMessage()) {
      <div class="ct-reset-password__row ct-reset-password__row--error">
        {{ errorMessage() }}
      </div>
    }

    <div class="ct-reset-password__row ct-reset-password__row--actions">
      <button
        ctButton
        ctButtonVariant="primary"
        [disabled]="!form().valid() || passwordResetInProgress()"
        (click)="submit()"
      >
        {{ passwordResetInProgress() ? 'Submitting...' : 'Submit' }}
      </button>
    </div>
  </div>
</div>
