<div class="ct-admin-cars">
  <ct-car-list
    title="All Cars"
    [cars]="cars()"
    [isAdmin]="true"
    [isLoadingCars]="isLoadingCars()"
    [hideAddCar]="true"
    [showOwners]="true"
    (searchTermChanged)="onSearchTermChanged($event)"
    (carCreated)="onCarCreated($event)"
    (carDeleted)="onCarDeleted($event)"
    (carClicked)="onCarClicked($event)"
  ></ct-car-list>
</div>
